# PR·main 검증. 배포는 deploy.yml(아직 비활성).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: 비밀값·금지 단어 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: API 키 패턴
        run: |
          if git grep -I -n -E 'sk-[A-Za-z0-9]{20,}' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::API 키로 보이는 문자열이 커밋돼 있습니다"; exit 1; fi
      - name: 공개 레포 금지 단어
        run: |
          if git grep -I -n -i -E '\bKT\b|케이티|ktcs|kt ?cs' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::공개 레포에 넣지 않기로 한 단어가 있습니다 (텍스트 파일 기준)"; exit 1; fi

  python:
    name: Python 테스트 (AI 파이프라인·스크립트)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      AI_MODE: fake            # 키 없음 → 스텁·fake 경로. DB 통합 테스트는 로컬 Postgres 가 없어 skip 된다
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ai/uv.lock
      - name: 의존성 (graph extra 포함 — kiwi·langgraph)
        working-directory: ai
        run: uv sync -q --extra graph
      - name: pytest
        working-directory: ai
        run: uv run pytest -q -ra

  spring:
    name: Spring 테스트 (Testcontainers)
    runs-on: ubuntu-latest   # Docker 내장 — Testcontainers 가 pgvector 이미지를 띄운다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: gradle test
        working-directory: api
        run: ./gradlew test --console=plain
      - name: 결과 요약
        if: always()
        working-directory: api
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, re
          t = f = e = s = 0
          for p in glob.glob('build/test-results/test/*.xml'):
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', open(p, encoding='utf-8').read())
              if m:
                  a = list(map(int, m.groups())); t += a[0]; s += a[1]; f += a[2]; e += a[3]
          print(f"### Spring 테스트\n\n| tests | skipped | failures | errors |\n|---|---|---|---|\n| {t} | {s} | {f} | {e} |")
          EOF
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: spring-test-reports
          path: api/build/reports/tests/test

  policy-data:
    name: 규정 원문 변환 점검 (data/policies/src 변경 시)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 바뀐 slug 찾기
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          slugs=$(git diff --name-only "$base"...HEAD -- data/policies/src | awk -F/ 'NF>3 {print $4}' | sort -u | tr '\n' ' ')
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "changed slugs: ${slugs:-none}"
      - uses: astral-sh/setup-uv@v5
        if: steps.changed.outputs.slugs != ''
      - name: 변환기 실행 → 청크 수·id 요약
        if: steps.changed.outputs.slugs != ''
        run: |
          cd ai && uv sync -q --extra graph && cd ..
          {
            echo "### 규정 원문 변환 점검"
            for slug in ${{ steps.changed.outputs.slugs }}; do
              dir="data/policies/src/$slug"
              echo; echo "#### $slug"
              if [ ! -f "$dir/meta.json" ] || [ ! -f "$dir/$slug.md" ]; then
                echo "- meta.json 또는 $slug.md 없음 (HWPX 원문이면 변환 결과 chunks.json 을 함께 올렸는지 확인)"; continue; fi
              ws=$(python3 -c "import json;print(json.load(open('$dir/meta.json',encoding='utf-8'))['workspace_id'])")
              title=$(python3 -c "import json;print(json.load(open('$dir/meta.json',encoding='utf-8'))['title'])")
              ver=$(python3 -c "import json;print(json.load(open('$dir/meta.json',encoding='utf-8'))['version'])")
              echo '```'
              (cd ai && uv run python ../scripts/build_policy_json.py "../$dir/$slug.md" --slug "$slug" --workspace "$ws" --title "$title" --version "$ver" --out /tmp/chk) || echo "변환 실패"
              echo '```'
              python3 - "$slug" <<'EOF'
          import json, sys
          slug = sys.argv[1]
          doc = json.load(open(f"/tmp/chk/{slug}.chunks.json", encoding="utf-8"))
          ids = [c["id"] for c in doc["chunks"]]
          long = [c["id"] for c in doc["chunks"] if len(c["text"]) > 700]
          seq = [i for i in ids if i.split("-")[-2].startswith("s")]
          bad = [c["id"] for c in doc["chunks"] if "|---" in c["text"] or "**" in c["text"] or "#" in c["text"]]
          print(f"- 청크 {len(ids)} · 조문 {len(set(c['article_label'] for c in doc['chunks']))} · 700자 초과 {len(long)} · 순번(s) id {len(seq)} · 장식 문자 포함 {len(bad)}")
          if seq: print("- 순번 id(별표·서문이 아니면 형식 위반): " + ", ".join(seq[:20]))
          if bad: print("- 장식 문자: " + ", ".join(bad[:10]))
          EOF
            done
          } >> "$GITHUB_STEP_SUMMARY"
