[project]
name = "oom-assist-ai"
version = "0.1.0"
description = "OoM Assist AI 서비스 — LangGraph 질의 파이프라인(SSE), 정제 워커, 인덱싱"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 형태소 분석기(kiwi)·LangGraph 는 선택 설치. 없으면 정규식 토크나이저 + pipeline.run 직접 구동으로 동작한다.
graph = [
    "langgraph>=0.2",
    "kiwipiepy>=0.18",
]

# uv sync 가 기본으로 포함하는 개발 의존성 (pytest · TestClient 용 httpx)
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
