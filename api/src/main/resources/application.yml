spring:
  application:
    name: oom-assist-api
  threads:
    virtual:
      enabled: true                      # SSE 릴레이를 블로킹 루프로 쓰기 위해
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oom}
    username: ${DB_USER:oom}             # 운영: oom_api
    password: ${DB_PASSWORD:oom}
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${FLYWAY_USER:${DB_USER:oom}}  # 스키마 소유자. 운영에서는 DB 관리자 계정
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD:oom}}
    placeholders:
      oom_api_password: ${OOM_API_PASSWORD:oom_api}
      oom_ai_password: ${OOM_AI_PASSWORD:oom_ai}
  jackson:
    property-naming-strategy: SNAKE_CASE # 응답 JSON은 snake_case (프론트 계약)
    default-property-inclusion: always
  mvc:
    async:
      request-timeout: 180000            # SSE 스트림 (ms)
  servlet:
    multipart:
      max-file-size: 30MB                # 규정 원본 업로드(POST /documents/uploads)
      max-request-size: 31MB
  session:
    timeout: 30m                         # 미사용 30분이면 세션 종료 (보호조치 기준 §4, 개발문서 35). 요청마다 연장
    jdbc:
      initialize-schema: never           # spring_session 테이블은 Flyway V4 가 만든다
      table-name: spring_session

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain  # text/event-stream 제외 (버퍼링 방지)

management:
  endpoints:
    web:
      exposure:
        include: health,info

oom:
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3000}
  public-tenant: ${PUBLIC_TENANT:}                   # 로그인 전 GET /workspaces 에 부서를 보여 줄 데모 회사 slug. 비우면 로그인 전에는 빈 목록
  legal:
    privacy-policy-path: ${PRIVACY_POLICY_PATH:../data/legal/privacy_policy.md}   # GET /auth/privacy-policy 가 읽는 문안. 작업 폴더가 api/ 기준
  storage:
    uploads-dir: ${UPLOADS_DIR:../data/uploads}     # 규정 원본 · 검수한 MD. AI 워커와 같은 폴더(운영은 공유 볼륨)
  chain-summary:
    auto-on-read: ${CHAIN_SUMMARY_AUTO:true}          # false 면 GET /chains 가 AI 요약 생성을 시작하지 않는다(저장된 요약만) — LLM 호출을 멈출 때
  session:
    cookie-name: OOMSESSION                          # 세션 자체는 Spring Session JDBC(spring_session 테이블), 쿠키 속성만 여기(SecurityConfig.cookieSerializer)
    same-site: ${SESSION_SAME_SITE:Lax}              # 프론트가 다른 사이트(예: *.vercel.app)면 None + secure=true 가 필요
    secure: ${SESSION_SECURE_COOKIE:false}
